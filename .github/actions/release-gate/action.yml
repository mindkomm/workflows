name: 'Release gate'
description: >-
  Reports a commit status on the head of the open release-please pull request
  (or on an explicit SHA). Required as a status check on the target branch, it
  blocks merging the release PR while assets are still being built and
  committed on that branch, and lets it through once the build landed and
  release-please refreshed the PR. Statuses are posted through the API instead
  of relying on `pull_request` jobs because workflows triggered by the
  release-please bot never run (they end up as `action_required`).
inputs:
  state:
    description: 'Status to report: pending, success, failure or error.'
    required: true
    type: string
  sha:
    description: >-
      Commit to report the status on. Defaults to the head of the open pull
      request from `head-branch`; nothing is reported when no such PR exists.
    required: false
    default: ''
    type: string
  target-branch:
    description: Branch release-please targets. Defaults to the current branch.
    required: false
    default: ''
    type: string
  head-branch:
    description: >-
      Branch of the release PR. Defaults to release-please's default naming,
      `release-please--branches--<target-branch>`.
    required: false
    default: ''
    type: string
  context:
    description: Name of the status check, as referenced by the ruleset.
    required: false
    default: 'release-gate'
    type: string
  description:
    description: Short text shown next to the status. Defaults to a text per state.
    required: false
    default: ''
    type: string
  token:
    description: Token with `statuses:write` and `pull-requests:read`.
    required: false
    default: ${{ github.token }}
    type: string
outputs:
  sha:
    description: The commit the status was reported on, empty when nothing was reported.
    value: ${{ steps.report.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Report status
      id: report
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        STATE: ${{ inputs.state }}
        SHA: ${{ inputs.sha }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        HEAD_BRANCH: ${{ inputs.head-branch }}
        CONTEXT: ${{ inputs.context }}
        DESCRIPTION: ${{ inputs.description }}
      run: |
        set -euo pipefail

        case "$STATE" in
          pending|success|failure|error) ;;
          *)
            echo "::error::Invalid state '$STATE', expected pending, success, failure or error."
            exit 1
            ;;
        esac

        target="${TARGET_BRANCH:-$GITHUB_REF_NAME}"
        head="${HEAD_BRANCH:-release-please--branches--$target}"
        sha="$SHA"

        if [ -z "$sha" ]; then
          sha=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$head" --limit 1 \
            --json headRefOid --jq '.[0].headRefOid // empty')
          if [ -z "$sha" ]; then
            echo "No open pull request from '$head', nothing to report."
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        if [ -z "$DESCRIPTION" ]; then
          case "$STATE" in
            pending) DESCRIPTION="Building assets on $target…" ;;
            success) DESCRIPTION="Assets are built and committed on $target." ;;
            *)       DESCRIPTION="Asset build on $target did not succeed, check the run." ;;
          esac
        fi

        gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" --silent \
          -f state="$STATE" \
          -f context="$CONTEXT" \
          -f description="$DESCRIPTION" \
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

        echo "Reported '$CONTEXT' = $STATE on $sha."
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
