name: Assets

on:
  workflow_call:
    inputs:
      ref:
        description: Branch or ref to checkout and commit to.
        type: string
        default: ''
    secrets:
      READ_PACKAGES_TOKEN:
        description: Token to read packages from GitHub Packages.
        required: true
      DEPLOY_KEY:
        description: >-
          Private SSH deploy key with write access. When set, the commit is
          pushed with it instead of GITHUB_TOKEN, so a ruleset that lists deploy
          keys as bypass actors lets the push through required status checks
          (needed with the release gate). Pushes made with a deploy key trigger
          workflows, so the commit carries "[skip ci]" in its body.
        required: false

permissions:
  contents: write

jobs:
  build-assets:
    name: Build & commit assets
    runs-on: ubuntu-latest
    env:
      NPM_AUTH_TOKEN: "${{ secrets.READ_PACKAGES_TOKEN }}"
      NODE_AUTH_TOKEN: "${{ secrets.READ_PACKAGES_TOKEN }}"
    outputs:
      commit_hash: ${{ steps.commit.outputs.commit_hash }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.head_ref || github.ref_name }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: PNPM setup
        uses: pnpm/action-setup@v5

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build commands
        run: pnpm run build

      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: |
            fix(assets): 🤖 Build assets
            ${{ secrets.DEPLOY_KEY != '' && '
            [skip ci]' || '' }}
